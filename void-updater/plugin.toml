id = "helmsman/void-updater"
name = "Void Updater"
version = "1.0.0"
plugin_api = 9
author = "helmsman"
license = "MIT"
icon = "package"
description = "Check xbps and Flatpak updates, get a reboot heads-up, then upgrade from a terminal."
dependencies = ["awk", "doas", "flatpak", "sed", "sh", "sudo", "test", "uname", "xbps-install", "xdg-open"]
tags = ["void", "bar", "panel", "launcher", "system", "utility"]

# ── General ──────────────────────────────────────────────────────────────────

[[setting]]
key = "flatpak_enabled"
type = "bool"
label_key = "settings.flatpak_enabled.label"
description_key = "settings.flatpak_enabled.description"
default = true

[[setting]]
key = "ignore_packages"
type = "string_list"
label_key = "settings.ignore_packages.label"
description_key = "settings.ignore_packages.description"
default = []

[[setting]]
key = "auto_check_hours"
type = "int"
label_key = "settings.auto_check_hours.label"
description_key = "settings.auto_check_hours.description"
default = 0
min = 0
max = 168

[[setting]]
key = "notify_on_updates"
type = "bool"
label_key = "settings.notify_on_updates.label"
description_key = "settings.notify_on_updates.description"
default = true

[[setting]]
key = "check_reboot_needed"
type = "bool"
label_key = "settings.check_reboot_needed.label"
description_key = "settings.check_reboot_needed.description"
default = true

# ── Update run ───────────────────────────────────────────────────────────────

[[setting]]
key = "terminal"
type = "string"
label_key = "settings.terminal.label"
description_key = "settings.terminal.description"
default = ""

[[setting]]
key = "elevation"
type = "select"
label_key = "settings.elevation.label"
description_key = "settings.elevation.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.elevation.options.auto" },
  { value = "sudo", label_key = "settings.elevation.options.sudo" },
  { value = "doas", label_key = "settings.elevation.options.doas" },
  { value = "none", label_key = "settings.elevation.options.none" },
]

[[setting]]
key = "assume_yes"
type = "bool"
label_key = "settings.assume_yes.label"
description_key = "settings.assume_yes.description"
default = false
advanced = true

[[setting]]
key = "check_cmd"
type = "string"
label_key = "settings.check_cmd.label"
description_key = "settings.check_cmd.description"
default = ""
advanced = true

[[setting]]
key = "update_cmd"
type = "string"
label_key = "settings.update_cmd.label"
description_key = "settings.update_cmd.description"
default = ""
advanced = true

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 540
placement = "attached"
position = "auto"
open_near_click = true

[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "package"

  [[widget.setting]]
  key = "show_count"
  type = "bool"
  label_key = "settings.show_count.label"
  description_key = "settings.show_count.description"
  default = true

  [[widget.setting]]
  key = "hide_on_empty"
  type = "bool"
  label_key = "settings.hide_on_empty.label"
  description_key = "settings.hide_on_empty.description"
  default = false

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "void"
glyph = "package"
include_in_global_search = false
